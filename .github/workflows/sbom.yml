name: "SSDLC: Generate SBOM"

# A CycloneDX software bill of materials for every commit on main and for
# every published release, generated by the shared reusable workflow in
# mozilla/ssdlc-actions. Each SBOM is submitted to the dependency graph and
# kept as a workflow artifact; for a release it is also attached to the
# release as an asset. Releases here are published by a person, so the
# `release` event does fire (it would not for a release created by a
# workflow's own GITHUB_TOKEN).

on:
    push:
        branches:
            - main
    release:
        types:
            - published
    workflow_dispatch:

# Default to no permissions; the job grants only what it needs.
permissions: {}

jobs:
    sbom:
        name: Generate SBOM
        if: github.repository == 'mozilla/ensemble'
        permissions:
            contents: write # submit the SBOM to the dependency graph and attach it to the release
            actions: read # let the reusable workflow upload the SBOM as a workflow artifact
        uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@5e1ea380f75b02891de776dcc00e74ad7cfeca9c # v1.3
        with:
            # The tag for a release, the commit for a push to main.
            sbom_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
